name: Standalone builds and simulated recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    name: Build and test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Fetch hash-verified test fixtures
        run: python ci/fixtures.py
      - name: Test wrapper and recovery guards
        run: python -B -m unittest -v
      - name: Build standalone runtime
        run: python build_standalone.py
      - name: Run the extracted executable and GUI in simulation
        run: python ci/verify_bundle.py
      - name: Upload standalone packages
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: standalone/*
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14
